schema_version: 1

context:
  name: libta-lib
  version: "0.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/TA-Lib/ta-lib/archive/refs/tags/v${{ version }}.tar.gz
    sha256: b30f58c24587f5ac46abe7caded1b49c3e1639ca177f4f51079d4fe051a5fae1

build:
  number: 0

requirements:
  build:
    - cmake
    - if: unix
      then: ninja
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - ta-lib
      include:
        - ta-lib/ta_abstract.h
        - ta-lib/ta_common.h
        - ta-lib/ta_defs.h
        - ta-lib/ta_func.h
        - ta-lib/ta_libc.h
      files:
        - if: win
          then: Library/lib/ta-lib-static.lib

about:
  summary: "TA-Lib : Technical Analysis Library"
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://ta-lib.org/index.html

extra:
  recipe-maintainers:
    - sanurielf
    - gerrymanoim
    - llllllllll
    - richafrank
    - mgorny
