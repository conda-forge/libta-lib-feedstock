schema_version: 1

context:
  name: libta-lib
  version: "0.6.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - if: unix
    then:
      - url: https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
        sha256: aa04066d17d69c73b1baaef0883414d3d56ab3775872d82916d1cdb376a3ae86
        target_directory: unix
  - url: https://github.com/TA-Lib/ta-lib/archive/refs/tags/v0.6.4.zip
    sha256: 33e99e0f4c2102b544619e038a00169d5b2f0577c5328e5736f3c5c443ed49bd
    target_directory: win

build:
  number: 0

requirements:
  build:
    - cmake
    - if: unix
      then:
        - gnuconfig
        - make
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - ta-lib
      include:
        - ta-lib/ta_abstract.h
        - ta-lib/ta_common.h
        - ta-lib/ta_defs.h
        - ta-lib/ta_func.h
        - ta-lib/ta_libc.h
      files:
        - if: win
          then: Library/lib/ta-lib-static.lib

about:
  summary: "TA-Lib : Technical Analysis Library"
  license: BSD-2-Clause
  # License is included in windows source download, but not unix:
  license_file: win/LICENSE
  homepage: https://ta-lib.org/index.html

extra:
  recipe-maintainers:
    - sanurielf
    - gerrymanoim
    - llllllllll
    - richafrank
